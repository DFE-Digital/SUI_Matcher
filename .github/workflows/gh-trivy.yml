name: Trivy Vulnerability Scan

on:
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Trivy File Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy file scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: false
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          vuln-type: os,library
          scanners: vuln,secret,misconfig

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-results.sarif

      - name: Publish Trivy output to summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Trivy Repository Results"
            echo ""

            if [[ -s trivy-results.sarif ]]; then
              finding_count=$(jq '[.runs[]?.results[]?] | length' trivy-results.sarif)
              echo "- Findings: $finding_count"

              if [[ "$finding_count" -gt 0 ]]; then
                echo ""
                echo "<details><summary>Detected findings</summary>"
                echo ""
                echo '```text'
                jq -r '
                  .runs[]?.results[]?
                  | "[\(.level // "unknown")] \(.ruleId // "unclassified"): \(.message.text // "No description")\n  \(.locations[0]?.physicalLocation?.artifactLocation?.uri // "Location unavailable")"
                ' trivy-results.sarif
                echo '```'
                echo "</details>"
              fi
            else
              echo "No repository scan report was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies for licence scanning
        run: dotnet restore sui-matching.sln --packages .trivy-packages -p:RestoreUseStaticGraphEvaluation=true

      - name: Print all detected licences
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .trivy-packages
          scanners: license
          skip-files: "**/*.deps.json"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          output: trivy-license-results.txt
          exit-code: 0
          skip-setup-trivy: true
        env:
          TRIVY_LICENSE_FULL: "true"

      - name: Check for restricted or forbidden licences
        id: licence-policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .trivy-packages
          scanners: license
          skip-files: "**/*.deps.json"
          severity: HIGH,CRITICAL
          format: table
          output: trivy-license-policy-results.txt
          exit-code: 1
          skip-setup-trivy: true
        env:
          TRIVY_LICENSE_FULL: "true"

      - name: Publish licence output to summary
        if: always()
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.licence-policy.outcome }}
        run: |
          {
            echo "### Trivy Dependency Licence Results"
            echo ""

            if [[ "$POLICY_OUTCOME" == "success" ]]; then
              echo "- Policy check: Passed - no restricted or forbidden licences detected."
            elif [[ "$POLICY_OUTCOME" == "failure" ]]; then
              echo "- Policy check: Failed - restricted or forbidden licences detected."
            else
              echo "- Policy check: Did not complete."
            fi

            if [[ -s trivy-license-results.txt ]]; then
              echo ""
              echo "<details><summary>All detected licences</summary>"
              echo ""
              echo '```text'
              cat trivy-license-results.txt
              echo '```'
              echo "</details>"
            else
              echo ""
              echo "No licence scan report was generated."
            fi

            if [[ "$POLICY_OUTCOME" == "failure" && -s trivy-license-policy-results.txt ]]; then
              echo ""
              echo "<details open><summary>Restricted or forbidden licences</summary>"
              echo ""
              echo '```text'
              cat trivy-license-policy-results.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on restricted or forbidden licences
        if: steps.licence-policy.outcome == 'failure'
        shell: bash
        run: exit 1
